[package]
name = "koushi-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
koushi-diagnostics = { path = "../koushi-diagnostics" }
koushi-protocol = { path = "../koushi-protocol" }
koushi-sdk = { path = "../koushi-sdk" }
koushi-key = { path = "../koushi-key" }
koushi-media = { path = "../koushi-media" }
koushi-search = { path = "../koushi-search" }
koushi-state = { path = "../koushi-state" }
koushi-store = { path = "../koushi-store" }
base64 = "0.22"
eyeball = "0.8"
eyeball-im = "0.9"
futures-util = "0.3"
regex = "1"
matrix-sdk = { workspace = true }
matrix-sdk-base = { workspace = true }
matrix-sdk-ui = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
url = "2"
vodozemac = { git = "https://github.com/matrix-org/vodozemac/", rev = "cfc4eee", features = ["insecure-pk-encryption", "experimental-session-config"] }
# Confined to executor.rs and channel plumbing per Platform Portability rule 2.
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[features]
# Exposes narrow runtime hooks for koushi-qa and integration tests.
test-hooks = ["koushi-sdk/test-hooks", "koushi-store/test-hooks"]

[dev-dependencies]
koushi-sdk = { path = "../koushi-sdk", features = ["test-hooks"] }
koushi-store = { path = "../koushi-store", features = ["test-hooks"] }
# Decodable PNG fixtures for upload-output preparation tests. Already a
# workspace dependency: koushi-media encodes with it in production.
image.workspace = true
matrix-sdk = { workspace = true, features = ["testing"] }
matrix-sdk-test = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "rt", "sync", "time", "macros", "test-util"] }
wiremock = "0.6"
