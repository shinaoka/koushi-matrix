[workspace]
members = [
    "crates/koushi-state",
    "crates/koushi-protocol",
    "crates/koushi-search",
    "crates/koushi-key",
    "crates/koushi-sdk",
    "crates/koushi-core",
    "crates/koushi-qa",
    "crates/koushi-diagnostics",
    "crates/koushi-media",
    "crates/koushi-store",
    "crates/koushi-core-testkit",
    "apps/desktop/src-tauri",
    "tests/windows-overlay-acl",
    "spikes/sidebar-composition",
    "spikes/key-management",
]
default-members = [
    "crates/koushi-state",
    "crates/koushi-protocol",
    "crates/koushi-search",
    "crates/koushi-key",
    "crates/koushi-sdk",
    "crates/koushi-core",
    "crates/koushi-diagnostics",
    "crates/koushi-store",
    "apps/desktop/src-tauri",
]
resolver = "2"
exclude = ["vendor/matrix-rust-sdk"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
matrix-sdk = { path = "vendor/matrix-rust-sdk/crates/matrix-sdk", default-features = false, features = ["automatic-room-key-forwarding", "e2e-encryption", "experimental-search", "sqlite"] }
matrix-sdk-base = { path = "vendor/matrix-rust-sdk/crates/matrix-sdk-base" }
matrix-sdk-search = { path = "vendor/matrix-rust-sdk/crates/matrix-sdk-search" }
matrix-sdk-test = { path = "vendor/matrix-rust-sdk/testing/matrix-sdk-test" }
matrix-sdk-ui = { path = "vendor/matrix-rust-sdk/crates/matrix-sdk-ui", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "webp"] }
heif-oxide = "0.1.0"

[profile.dev.package."*"]
debug = false

# Hosted correctness CI should retain assertions and overflow checks while
# avoiding debuginfo and incremental artifacts that are not useful across
# ephemeral runners. Local development and release profiles remain unchanged.
[profile.ci]
inherits = "test"
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false
strip = "symbols"
