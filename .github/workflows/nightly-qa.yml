name: Nightly aggregate QA

# The full aggregate headless lane (every Core QA scenario against a real
# disposable homeserver) is too long for PR CI and is a required local gate, so
# run it nightly per server. A failure opens one issue per server labelled
# `nightly-qa`; a repeated failure comments on that open issue instead of
# creating a duplicate. Different servers cannot collide on a signature, and the
# workflow concurrency group serialises runs.
#
# The `focused` job runs the scenarios that `all` does not cover (the nightly
# list in scripts/lib/headless-qa-lanes.mjs), each in its own homeserver. Every
# failing scenario files or updates its own issue; one failure does not stop the
# remaining scenarios.
#
# An issue's identity is its signature label, never its title:
# `nightly-qa/<server>/<scenario>`, or `nightly-qa/<server>/aggregate` for the
# aggregate job. The scraped failure stage is diagnostic detail carried by the
# body and the comments, because it varies run to run ("unknown" when the log
# line is missing) and a title that carried it filed a fresh issue for every
# recurrence of the same failure.
#
# A passing run is recorded on the open issue of each signature it covers, and
# the issue closes after PASSES_TO_CLOSE consecutive passing runs once a commit
# on main references it
# (scripts/nightly-qa-record-passes.mjs, REPOSITORY_RULES "GitHub Issue
# Closure"). A failure whose signature has only a closed issue reopens it.
# Issues are filed and updated only for runs of `main`; a dispatch on another
# branch runs the lanes without touching issues.
on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-aggregate-qa
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  aggregate:
    name: Aggregate headless lane (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        server: [tuwunel, synapse]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          # Full history: a pass counts toward closing an issue only once a
          # commit on main references it (scripts/nightly-qa-record-passes.mjs).
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: . -> target-ci
          shared-key: nightly-aggregate-qa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev
      - name: Submodule sync guard
        run: node scripts/check-sdk-submodule.mjs
      - name: Cache Tuwunel v1.7.1 download
        if: matrix.server == 'tuwunel'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/koushi/tuwunel/v1.7.1
          key: tuwunel-v1.7.1-x86_64-v1-linux-gnu-64d6b60a781e2dad74e840ed6e211eced8c4206ce2d307fe62bbc62e3ffcc983
      - name: Install Tuwunel v1.7.1
        if: matrix.server == 'tuwunel'
        env:
          TUWUNEL_URL: https://github.com/matrix-construct/tuwunel/releases/download/v1.7.1/v1.7.1-release-all-x86_64-v1-linux-gnu-tuwunel.zst
          TUWUNEL_SHA256: 64d6b60a781e2dad74e840ed6e211eced8c4206ce2d307fe62bbc62e3ffcc983
        run: |
          sudo apt-get install -y --no-install-recommends zstd
          mkdir -p "$HOME/.cache/koushi/tuwunel/v1.7.1" "$HOME/.local/bin"
          archive="$HOME/.cache/koushi/tuwunel/v1.7.1/tuwunel.zst"
          if [[ ! -s "$archive" ]]; then
            curl --proto '=https' --tlsv1.2 -fsSLo "$archive" "$TUWUNEL_URL"
          fi
          printf '%s  %s\n' "$TUWUNEL_SHA256" "$archive" | sha256sum --check --strict
          unzstd -f -o "$HOME/.local/bin/tuwunel" "$archive"
          chmod 0755 "$HOME/.local/bin/tuwunel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Tuwunel is runnable
        if: matrix.server == 'tuwunel'
        run: tuwunel --version
      - name: Verify Docker is available for Synapse
        if: matrix.server == 'synapse'
        run: docker version
      - name: Aggregate headless lane (Core, every scenario)
        run: |
          node scripts/desktop-headless-local-qa.mjs --run \
            --server=${{ matrix.server }} --core --scenario=all \
            --cargo-profile=ci --timeout-ms=600000
      - name: Record the passing run on its open issue
        if: success() && github.ref == 'refs/heads/main'
        # Bookkeeping, not the gate: a transient `gh` failure must not fail the lane.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/nightly-qa-record-passes.mjs --server=${{ matrix.server }} \
            --scenario=aggregate --run-id="$RUN_ID" --run-url="$RUN_URL"
      - name: Upload QA logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-aggregate-qa-${{ matrix.server }}-logs
          # Only the runner's private-data-validated outputs; raw homeserver
          # logs can contain Matrix request metadata.
          path: |
            .local-secrets/headless-local-qa/**/core-*.log
            .local-secrets/headless-local-qa/**/sdk-*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: File or update the failure issue
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ matrix.server }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          stage=$(grep -he 'Headless core QA failed: ' \
            .local-secrets/headless-local-qa/*/core-core-stderr.log 2>/dev/null \
            | tail -1 | sed -E 's/^Headless core QA failed: ([^: ]+).*/\1/')
          [ -n "$stage" ] || stage="unknown"
          title="nightly-qa: aggregate headless lane failed (${SERVER})"
          # Identity is the signature label, never the title: the stage above is
          # scraped from a log and varies run to run ("unknown" when the line is
          # missing), so a title that carried it filed a fresh issue for every
          # recurrence of the same failure.
          signature="nightly-qa/${SERVER}/aggregate"
          # The two matrix jobs cannot produce the same signature, so this
          # check-then-act cannot race.
          gh label create nightly-qa --description "Nightly aggregate headless QA lane failure" --color 1D76DB 2>/dev/null || true
          gh label create "$signature" --description "Open nightly failure: aggregate headless lane on ${SERVER}" --color BFD4F2 2>/dev/null || true
          number=$(gh issue list --label nightly-qa --label "$signature" --state open \
            --limit 100 --json number --jq '.[0].number // ""')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body \
              "The nightly aggregate lane failed again on \`${SERVER}\` (stage \`${stage}\`): ${RUN_URL}"
            exit 0
          fi
          # A recurrence after closure reopens the closed issue, so the failure's
          # history and its earlier fix attempts stay in one place.
          number=$(gh issue list --label nightly-qa --label "$signature" --state closed \
            --limit 1 --json number --jq '.[0].number // ""')
          if [ -n "$number" ]; then
            gh issue reopen "$number" --comment \
              "The nightly aggregate lane failed again on \`${SERVER}\` after this issue was closed (stage \`${stage}\`): ${RUN_URL}"
            exit 0
          fi
          body=$(cat <<EOF
          The nightly aggregate headless lane failed on \`${SERVER}\`.

          - Failing stage: \`${stage}\`
          - Run: ${RUN_URL}
          - Command: \`node scripts/desktop-headless-local-qa.mjs --run --server=${SERVER} --core --scenario=all --cargo-profile=ci --timeout-ms=600000\`
          - Validated QA logs are attached to the run as \`nightly-aggregate-qa-${SERVER}-logs\`.

          Filed automatically by \`.github/workflows/nightly-qa.yml\`.
          EOF
          )
          gh issue create --title "$title" --label nightly-qa --label "$signature" --body "$body"

  focused:
    name: Focused scenarios outside all (${{ matrix.server }})
    runs-on: ubuntu-latest
    # 14 scenarios at up to 10 min each, plus the build.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        server: [tuwunel, synapse]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          # Full history: a pass counts toward closing an issue only once a
          # commit on main references it (scripts/nightly-qa-record-passes.mjs).
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: . -> target-ci
          shared-key: nightly-focused-qa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev
      - name: Submodule sync guard
        run: node scripts/check-sdk-submodule.mjs
      - name: Cache Tuwunel v1.7.1 download
        if: matrix.server == 'tuwunel'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/koushi/tuwunel/v1.7.1
          key: tuwunel-v1.7.1-x86_64-v1-linux-gnu-64d6b60a781e2dad74e840ed6e211eced8c4206ce2d307fe62bbc62e3ffcc983
      - name: Install Tuwunel v1.7.1
        if: matrix.server == 'tuwunel'
        env:
          TUWUNEL_URL: https://github.com/matrix-construct/tuwunel/releases/download/v1.7.1/v1.7.1-release-all-x86_64-v1-linux-gnu-tuwunel.zst
          TUWUNEL_SHA256: 64d6b60a781e2dad74e840ed6e211eced8c4206ce2d307fe62bbc62e3ffcc983
        run: |
          sudo apt-get install -y --no-install-recommends zstd
          mkdir -p "$HOME/.cache/koushi/tuwunel/v1.7.1" "$HOME/.local/bin"
          archive="$HOME/.cache/koushi/tuwunel/v1.7.1/tuwunel.zst"
          if [[ ! -s "$archive" ]]; then
            curl --proto '=https' --tlsv1.2 -fsSLo "$archive" "$TUWUNEL_URL"
          fi
          printf '%s  %s\n' "$TUWUNEL_SHA256" "$archive" | sha256sum --check --strict
          unzstd -f -o "$HOME/.local/bin/tuwunel" "$archive"
          chmod 0755 "$HOME/.local/bin/tuwunel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Tuwunel is runnable
        if: matrix.server == 'tuwunel'
        run: tuwunel --version
      - name: Verify Docker is available for Synapse
        if: matrix.server == 'synapse'
        run: docker version
      - name: Focused nightly scenarios (continue past failures)
        run: |
          node scripts/headless-qa-lane.mjs --lane=nightly \
            --server=${{ matrix.server }} --cargo-profile=ci \
            --failures-out="$RUNNER_TEMP/nightly-failures.json"
      - name: Record passing scenarios on their open issues
        # The lane step fails when any scenario fails; the others still passed.
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node scripts/nightly-qa-record-passes.mjs --server=${{ matrix.server }} \
            --failures="$RUNNER_TEMP/nightly-failures.json" --run-id="$RUN_ID" \
            --run-url="$RUN_URL"
      - name: Upload QA logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-focused-qa-${{ matrix.server }}-logs
          # Only the runner's private-data-validated outputs; raw homeserver
          # logs can contain Matrix request metadata.
          path: |
            .local-secrets/headless-local-qa/**/core-*.log
            .local-secrets/headless-local-qa/**/sdk-*.log
          if-no-files-found: ignore
          retention-days: 14
      - name: File or update one issue per failing scenario
        if: failure() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ matrix.server }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failures="$RUNNER_TEMP/nightly-failures.json"
          if [ ! -s "$failures" ] || [ "$(jq length "$failures")" = "0" ]; then
            # The lane runner itself failed before recording scenarios.
            printf '[{"scenario":"focused-lane","stage":"runner"}]' > "$failures"
          fi
          gh label create nightly-qa --description "Nightly aggregate headless QA lane failure" --color 1D76DB 2>/dev/null || true
          jq -r '.[] | "\(.scenario)\t\(.stage)"' "$failures" | while IFS=$'\t' read -r scenario stage; do
            title="nightly-qa: ${scenario} failed (${SERVER})"
            # Identity is the signature label, never the title; the stage is
            # diagnostic detail that varies run to run. The two matrix jobs
            # cannot produce the same signature, so this cannot race.
            signature="nightly-qa/${SERVER}/${scenario}"
            gh label create "$signature" --description "Open nightly failure: ${scenario} on ${SERVER}" --color BFD4F2 2>/dev/null || true
            number=$(gh issue list --label nightly-qa --label "$signature" --state open \
              --limit 100 </dev/null --json number --jq '.[0].number // ""')
            if [ -n "$number" ]; then
              gh issue comment "$number" </dev/null --body \
                "The nightly \`${scenario}\` scenario failed again on \`${SERVER}\` (stage \`${stage}\`): ${RUN_URL}"
              continue
            fi
            number=$(gh issue list --label nightly-qa --label "$signature" --state closed \
              --limit 1 </dev/null --json number --jq '.[0].number // ""')
            if [ -n "$number" ]; then
              gh issue reopen "$number" </dev/null --comment \
                "The nightly \`${scenario}\` scenario failed again on \`${SERVER}\` after this issue was closed (stage \`${stage}\`): ${RUN_URL}"
              continue
            fi
            body=$(printf '%s\n' \
              "The nightly focused headless scenario \`${scenario}\` failed on \`${SERVER}\`." \
              "" \
              "- Failing stage: \`${stage}\`" \
              "- Run: ${RUN_URL}" \
              "- Command: \`node scripts/desktop-headless-local-qa.mjs --run --server=${SERVER} --core --scenario=${scenario} --cargo-profile=ci --timeout-ms=600000\`" \
              "- Validated QA logs are attached to the run as \`nightly-focused-qa-${SERVER}-logs\`." \
              "" \
              "Filed automatically by \`.github/workflows/nightly-qa.yml\`.")
            gh issue create --title "$title" --label nightly-qa --label "$signature" --body "$body" </dev/null
          done
