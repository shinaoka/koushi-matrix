[package]
name = "koushi-mcp-host"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "local MCP bridge hosted over Koushi account runtimes"
publish = false

[dependencies]
koushi-core = { path = "../koushi-core" }
koushi-diagnostics = { path = "../koushi-diagnostics" }
koushi-mcp = { path = "../koushi-mcp" }
koushi-protocol = { path = "../koushi-protocol" }
koushi-state = { path = "../koushi-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
koushi-core = { path = "../koushi-core", features = ["test-hooks"] }
koushi-key = { path = "../koushi-key" }
# A mock-homeserver SDK session, so a bridge send reaches inspectable content.
koushi-sdk = { path = "../koushi-sdk", features = ["test-hooks"] }
matrix-sdk = { workspace = true, features = ["testing"] }
matrix-sdk-test = { workspace = true }
tokio = { version = "1", features = ["test-util"] }
