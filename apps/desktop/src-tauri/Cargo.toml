[package]
name = "koushi-desktop"
version = "0.30.0"
edition = "2024"
license = "MIT"

[lib]
name = "koushi_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
jiff = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
koushi-core = { path = "../../../crates/koushi-core" }
koushi-protocol = { path = "../../../crates/koushi-protocol" }
koushi-diagnostics = { path = "../../../crates/koushi-diagnostics" }
koushi-key = { path = "../../../crates/koushi-key" }
koushi-mcp-host = { path = "../../../crates/koushi-mcp-host" }
koushi-state = { path = "../../../crates/koushi-state" }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "sync", "time"] }
# Builds the Claude Desktop extension (#1536 follow-up); stored entries only.
zip = { version = "4", default-features = false }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Desktop notification display plus click activation on Linux and Windows.
# `tauri-plugin-notification` can show a banner on desktop but has no activation
# path, and this is the same backend it uses underneath. macOS does not use it:
# its macOS backend never attaches a click waiter (#1128) and the macOS path
# sends through `mac-usernotifications` directly instead.
notify-rust = "4.18"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same GTK 3 binding Tauri already links; used for the clipboard image read
# and shared-mime-info lookups.
gtk = "0.18"
# glibc `mallinfo2` symbol lookup for the #1344 diagnostic memory audit.
# Only glibc builds have that symbol; resolved through `dlsym` so an older
# runtime reports it unavailable instead of failing to load.
libc = "0.2"
# Same WebKitGTK binding wry already links; used to enable spell checking,
# which WebKitGTK leaves off by default.
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# UNUserNotificationCenter delegate delivers body clicks asynchronously.
mac-usernotifications = "0.3.1"
# Mach `proc_pid_rusage` and libmalloc `malloc_zone_statistics` for the #1344
# diagnostic memory audit.
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSWindow", "NSSound", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
# HEIC/HEIF still decoding for media preparation (#1147): ImageIO source and
# primary-image thumbnail, rendered into an sRGB Core Graphics bitmap.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage"] }
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
tauri-plugin-updater = "2.11.0"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.13.1", default-features = false, features = ["json", "query", "rustls"] }
# Windows working-set and private-commit counters for the #1344 diagnostic
# memory audit.
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
tauri-plugin-updater = "2.11.0"

[dev-dependencies]
koushi-core = { path = "../../../crates/koushi-core", features = ["test-hooks"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Encodes genuine Apple HEIC fixtures at test time for the ImageIO decoder tests.
objc2-image-io = { version = "0.3", default-features = false, features = ["std", "CGImageDestination", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
