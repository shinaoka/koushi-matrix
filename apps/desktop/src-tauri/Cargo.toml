[package]
name = "koushi-desktop"
version = "0.14.0"
edition = "2024"
license = "MIT"

[lib]
name = "koushi_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
jiff = "0.2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
koushi-core = { path = "../../../crates/koushi-core" }
koushi-protocol = { path = "../../../crates/koushi-protocol" }
koushi-diagnostics = { path = "../../../crates/koushi-diagnostics" }
koushi-key = { path = "../../../crates/koushi-key" }
koushi-state = { path = "../../../crates/koushi-state" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-notification = "2.3.3"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
# Desktop notification display plus click activation. `tauri-plugin-notification`
# can show a banner on desktop but has no activation path, and this is the same
# backend it uses underneath.
notify-rust = "4.18"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same GTK 3 binding Tauri already links; used for the clipboard image read
# and shared-mime-info lookups.
gtk = "0.18"
# Same WebKitGTK binding wry already links; used to enable spell checking,
# which WebKitGTK leaves off by default.
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSWindow", "NSSound", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
tauri-plugin-updater = "2.11.0"

[dev-dependencies]
koushi-core = { path = "../../../crates/koushi-core", features = ["test-hooks"] }
tempfile = "3"
