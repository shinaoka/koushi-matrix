name: Matrix SDK security advisory check

# Hourly, match published advisories against the SDK crates (matrix-sdk*,
# ruma*, vodozemac) the root Cargo.lock pins: the repository advisories of
# matrix-org/matrix-rust-sdk, matrix-org/vodozemac and ruma/ruma, and RustSec
# through `cargo audit`. Each affecting advisory gets one issue labelled
# `security` whose title carries its ids; an existing issue in any state
# naming one of those ids suppresses a duplicate. The SDK crates are path
# dependencies, so Dependabot does not see them.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

# A rerun must not race an in-flight run into duplicate issues.
concurrency:
  group: sdk-security-advisory-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Match SDK advisories against the pinned versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.1
      - name: Match advisories and open security issues
        run: node scripts/sdk-security-advisory-check.mjs --lockfile Cargo.lock
