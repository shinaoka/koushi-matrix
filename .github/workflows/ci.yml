name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Newer runs supersede in-flight ones. Key off head_ref for PRs so that GitHub
# recomputing refs/pull/N/merge (on mergeability changes) does not spuriously
# cancel an in-flight PR run; fall back to github.ref for push events.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  user-help:
    name: User help (links / generated index)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test help tooling
        run: node --test scripts/user-help.test.mjs
      - name: Check help navigation and llms.txt
        run: node scripts/user-help.mjs --check

  frontend:
    name: Frontend (typecheck / vitest / build / secret-scan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Secret scan
        run: npm run qa:secret-scan
      # --- Boundary enforcement (#87 Phase 0) ---
      # ESLint import-boundary rule: components must not import @tauri-apps
      # directly; no file may path-escape into src-tauri.
      - name: ESLint import boundaries
        run: npm run lint
      # Tauri adapter boundary: src-tauri must not call koushi_sdk directly.
      - name: Tauri adapter boundary check
        run: npm run lint:tauri-boundary
      # Domain-crate platform-dep deny-list: koushi-state must not gain
      # platform/OS deps (pre-seeds Phase 5 SecretStore port).
      - name: Domain-crate platform-dep check
        run: npm run lint:domain-deps

  frontend-node-current:
    name: Frontend unit tests on current Node (vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 25+ predefines Web Storage globals; keep the jsdom suite
          # passing there as well as on the pinned LTS above.
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Unit tests (vitest)
        run: npm test

  readme-screenshot:
    name: README screenshot
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --user 0:0
    steps:
      - uses: actions/checkout@v4
      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci
      - name: Assert pinned Playwright version
        run: node -e 'const p=require("./apps/desktop/node_modules/@playwright/test/package.json"); if (p.version !== "1.60.0") throw new Error(`Unexpected @playwright/test ${p.version}`);'
      - name: Generate README screenshot
        run: |
          screenshot="$GITHUB_WORKSPACE/assets/screenshots/koushi-main.png"
          before_mtime="$(stat -c %Y "$screenshot")"
          npm --prefix apps/desktop run docs:screenshot
          after_mtime="$(stat -c %Y "$screenshot")"
          test "$after_mtime" -gt "$before_mtime"
          test -s "$screenshot"

  browser-headless:
    name: Browser headless (Playwright DOM tier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      # The config drives headless Chromium against the Vite-served harness
      # page and never launches a Tauri window. A short allow-list of
      # engine-native specs also runs in headless WebKit (#1145), the macOS
      # and Linux WebView engine family.
      - name: Install Playwright Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      # The repository treats browser-headless DOM proof as a primary gate for
      # GUI work, but nothing enforced it until now: a stale IPC-argument
      # assertion sat red on main from #319 until #323 found it by hand.
      - name: Browser-headless DOM tests
        run: npx playwright test

  rust:
    name: Rust (workspace / src-tauri / wasm)
    runs-on: ubuntu-latest
    env:
      # Keep CI artifacts under a predictable repo-local target dir.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
    steps:
      - uses: actions/checkout@v4
        with:
          # The vendored Matrix SDK is a public submodule; recursive checkout
          # clones it over the HTTPS URL in .gitmodules without any secret.
          submodules: recursive
      - name: Install Rust toolchain (1.96.0 + wasm target)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          # The root workspace owns the Tauri crate and the only Cargo.lock.
          workspaces: . -> target-ci
          # rust-cache never re-saves an exact hit, and its key hashes only
          # manifests, the lockfile and the toolchain. Bump this suffix when the
          # cargo command set changes the resolved feature graph, or the new
          # graph's dependencies recompile on every run.
          shared-key: koushi-rust-ci-unified-v1
      - name: Read vendored Matrix SDK revision
        id: sdk-revision
        run: echo "revision=$(git -C vendor/matrix-rust-sdk rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # rustup resolves rustc from rust-toolchain.toml in the checkout, so the
      # SDK cache key follows a toolchain bump without a hand-edited literal.
      - name: Read active rustc release
        id: rustc
        run: |
          release="$(rustc -vV | sed -n 's/^release: //p')"
          test -n "$release"
          echo "release=$release" >> "$GITHUB_OUTPUT"
      # rust-cache prunes path dependencies under the repository root, so the
      # vendored SDK has its own exact-keyed cache. Cargo judges path
      # dependencies by source mtime, and checkout stamps every file "now",
      # which makes restored artifacts stale. The key pins the SDK gitlink, so
      # normalizing the SDK's tracked sources to a fixed old mtime cannot mark
      # different source as fresh; a feature, profile, or rustc change still
      # selects a different fingerprint hash and recompiles.
      - name: Normalize vendored Matrix SDK source mtimes
        working-directory: vendor/matrix-rust-sdk
        run: git ls-files -z | xargs -0 touch -h -d '2000-01-01T00:00:00Z'
      - name: Cache vendored Matrix SDK CI artifacts
        id: sdk-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            target-ci/ci/.fingerprint/matrix-sdk-*
            target-ci/ci/build/matrix-sdk-*
            target-ci/ci/deps/libmatrix_sdk*
            target-ci/ci/deps/matrix_sdk*.d
          # Workspace manifests and this workflow's cargo command select the SDK
          # feature set. An exact hit is never re-saved, so all of them key it.
          key: koushi-sdk-artifacts-v2-${{ runner.os }}-rust-${{ steps.rustc.outputs.release }}-ci-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'apps/desktop/src-tauri/Cargo.toml', 'tests/*/Cargo.toml', 'spikes/*/Cargo.toml', '.github/workflows/ci.yml') }}-${{ steps.sdk-revision.outputs.revision }}
      - name: Report Rust cache state
        run: node scripts/ci-rust-cache-report.mjs --target-dir "$CARGO_TARGET_DIR" --profile ci --rust-cache-hit "${{ steps.rust-cache.outputs.cache-hit }}" --sdk-cache-hit "${{ steps.sdk-cache.outputs.cache-hit }}" --label rust
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libdbus-1-dev
      - name: Submodule sync guard
        run: node scripts/check-sdk-submodule.mjs
      - name: SDK upstream release checker tests
        run: node --test scripts/sdk-upstream-release-check.test.mjs
      - name: Release version checker tests
        run: node --test scripts/desktop-release-version.test.mjs
      # Every PR, not only a release PR: a stale Cargo.lock or npm lockfile
      # version is rewritten by the next `cargo` / `npm install` on any branch,
      # so the release bump would otherwise land in an unrelated PR (observed
      # after v0.11.1, #1137). The guard also fails on any tracked
      # version-bearing desktop file that it does not list.
      - name: Release version and lockfile sync guard
        run: node scripts/desktop-release-version.mjs
      - name: Diagnostic test isolation checker tests
        run: node --test scripts/check-diagnostic-test-isolation.test.mjs
      - name: Diagnostic test isolation guard
        run: node scripts/check-diagnostic-test-isolation.mjs
      - name: Protocol, QA, domain, and leaf boundary checker tests
        run: node --test scripts/check-protocol-qa-boundaries.test.mjs scripts/check-domain-crate-platform-deps.test.mjs scripts/check-leaf-crate-boundaries.test.mjs
      - name: Protocol and QA boundary guard
        run: node scripts/check-protocol-qa-boundaries.mjs
      - name: Domain and protocol dependency guard
        run: node scripts/check-domain-crate-platform-deps.mjs
      - name: Leaf crate boundary guard
        run: node scripts/check-leaf-crate-boundaries.mjs
      - name: Headless QA lane coverage checker tests
        run: node --test scripts/check-headless-qa-lanes.test.mjs
      - name: Headless QA lane coverage guard
        run: node scripts/check-headless-qa-lanes.mjs
      - name: Rust test structure checker tests
        run: node --test scripts/check-rust-test-structure.test.mjs
      - name: Rust test structure checker
        run: node scripts/check-rust-test-structure.mjs
      - name: Rust cache report contract tests
        run: node --test scripts/ci-rust-cache-report.test.mjs scripts/ci-rust-cache-metrics.test.mjs
      # One invocation runs the ordinary crates, the koushi-core-testkit
      # integration targets, and the koushi-desktop DTO/IPC contract tests.
      # Separate `-p` invocations resolved different feature sets and
      # recompiled the vendored SDK and Koushi stack twice more without adding
      # a test (see docs/agents/verification.md#what-ci-actually-gates).
      - name: Workspace tests (incl. Core testkit and Tauri DTO/IPC contracts)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/rust-metrics"
          cargo test --profile ci --workspace --exclude sidebar-composition --exclude key-management 2>&1 | tee "$RUNNER_TEMP/rust-metrics/workspace-tests.log"
      - name: Record workspace cargo metrics
        if: ${{ !cancelled() }}
        # Skip quietly when an earlier step failed before the suite wrote a log.
        run: |
          [ -f "$RUNNER_TEMP/rust-metrics/workspace-tests.log" ] || exit 0
          node scripts/ci-rust-cache-metrics.mjs --log "$RUNNER_TEMP/rust-metrics/workspace-tests.log" --target-dir "$CARGO_TARGET_DIR" --mode rust-workspace --cache-hit "${{ steps.sdk-cache.outputs.cache-hit == 'true' }}"
      - name: wasm build check (state + search + protocol)
        run: cargo check --profile ci --target wasm32-unknown-unknown -p koushi-state -p koushi-search -p koushi-protocol
      # --- Dependency hygiene (#87 Phase 0) ---
      # cargo-deny: license compliance + advisory check + bans.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.9
      - name: cargo-deny check
        run: cargo deny check
      # cargo-machete: detect unused Cargo.toml dependencies.
      - name: Install cargo-machete
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - name: cargo-machete (unused deps)
        run: cargo machete

  macos-cargo-check:
    name: macOS Tauri cargo check
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-macos-check
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-macos-check
          shared-key: koushi-macos-cargo-check
      - name: Check the macOS Tauri crate
        run: cargo check --profile ci -p koushi-desktop
      # Lint the macOS-only cfg paths Linux CI never compiles (#1035); reuses the
      # dependency metadata from the check above.
      - name: Clippy the macOS Tauri crate
        run: cargo clippy --profile ci -p koushi-desktop --all-targets --locked -- -D warnings
      # #1147: run the native ImageIO HEIC decoder for real. Linux CI only
      # type-checks this macOS-only adapter.
      - name: macOS ImageIO decoder tests
        run: cargo test --profile ci -p koushi-desktop --test image_io_decoder --locked -- --nocapture

  core-invites:
    # Prove invitation projection through the sole Simplified Sliding Sync
    # engine on both supported disposable local homeservers.
    name: Core invitations (${{ matrix.server }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: [tuwunel, synapse]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - name: Install Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@191af2e1955bbe165f9bbacff2d2438002dff4d4 # 1.96.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: . -> target-ci
          shared-key: koushi-core-invites-ci
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev
      - name: Submodule sync guard
        run: node scripts/check-sdk-submodule.mjs
      - name: Cache Tuwunel v1.7.1 download
        if: matrix.server == 'tuwunel'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/koushi/tuwunel/v1.7.1
          key: tuwunel-v1.7.1-x86_64-v1-linux-gnu-64d6b60a781e2dad74e840ed6e211eced8c4206ce2d307fe62bbc62e3ffcc983
      - name: Install Tuwunel v1.7.1
        if: matrix.server == 'tuwunel'
        env:
          TUWUNEL_URL: https://github.com/matrix-construct/tuwunel/releases/download/v1.7.1/v1.7.1-release-all-x86_64-v1-linux-gnu-tuwunel.zst
          TUWUNEL_SHA256: 64d6b60a781e2dad74e840ed6e211eced8c4206ce2d307fe62bbc62e3ffcc983
        run: |
          sudo apt-get install -y --no-install-recommends zstd
          mkdir -p "$HOME/.cache/koushi/tuwunel/v1.7.1" "$HOME/.local/bin"
          archive="$HOME/.cache/koushi/tuwunel/v1.7.1/tuwunel.zst"
          if [[ ! -s "$archive" ]]; then
            curl --proto '=https' --tlsv1.2 -fsSLo "$archive" "$TUWUNEL_URL"
          fi
          printf '%s  %s\n' "$TUWUNEL_SHA256" "$archive" | sha256sum --check --strict
          unzstd -f -o "$HOME/.local/bin/tuwunel" "$archive"
          chmod 0755 "$HOME/.local/bin/tuwunel"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify Tuwunel is runnable
        if: matrix.server == 'tuwunel'
        run: tuwunel --version
      - name: Verify Docker is available for Synapse
        if: matrix.server == 'synapse'
        run: docker version
      # The PR lane list lives in scripts/lib/headless-qa-lanes.mjs; heavier
      # focused scenarios run in the nightly workflow.
      - name: Focused PR scenarios (invitations, no-proof verification gate)
        run: |
          node scripts/headless-qa-lane.mjs --lane=pr \
            --server=${{ matrix.server }} --cargo-profile=ci
      - name: Upload server-specific core QA logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-invites-${{ matrix.server }}-qa-logs
          # Upload only the runner's private-data-validated outputs. Raw
          # homeserver logs can contain Matrix request metadata.
          path: |
            .local-secrets/headless-local-qa/**/core-*.log
            .local-secrets/headless-local-qa/**/sdk-*.log
          if-no-files-found: ignore
          retention-days: 7

  core-homeserver:
    name: Core QA binary tests
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-ci
          shared-key: koushi-core-homeserver-ci
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev
      - name: Submodule sync guard
        run: node scripts/check-sdk-submodule.mjs
      - name: QA binary unit tests
        # Also the only compile check for the QA binaries: a plain
        # `cargo test --profile ci --workspace` skips them because both bin targets set
        # `required-features = ["qa-bin"]`, which is how a broken
        # `RoomCommand::SetSpaceChild` call sat on main undetected.
        run: cargo test --profile ci -p koushi-qa --features qa-bin --bin headless-core-qa
      - name: Upload QA logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-homeserver-qa-logs
          # Token-only QA output; the runner refuses to print child output that
          # fails its private-data validation.
          path: |
            .local-secrets/headless-local-qa/**/core-*.log
            .local-secrets/headless-local-qa/**/sdk-*.log
          if-no-files-found: ignore
          retention-days: 7

  windows-overlay-acl:
    name: Windows overlay ACL IPC
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-windows-overlay
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain (1.96.0)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-windows-overlay
          shared-key: koushi-windows-tauri-native
      - name: Prove overlay set and clear cross the Tauri ACL
        run: cargo test --profile ci -p koushi-windows-overlay-acl windows_overlay_ipc_is_authorized -- --nocapture
      - name: Prove OIDC native browser launch outcomes
        run: cargo test --profile ci -p koushi-desktop oidc_browser --lib -- --nocapture
      # Lint the Windows-only cfg paths Linux CI never compiles (#1035).
      - name: Clippy the Windows Tauri crate
        run: cargo clippy --profile ci -p koushi-desktop --all-targets --locked -- -D warnings

  rust-lint:
    # Workspace formatting and lint gate. Kept in its own job so it runs in
    # parallel with the test jobs and never shares their target directory.
    name: Rust lint (rustfmt / clippy)
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-lint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain (1.96.0 + clippy, rustfmt)
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-lint
          shared-key: koushi-rust-lint
      # Formats workspace members only. Never `cargo fmt --all`: that also
      # formats path dependencies, i.e. the vendored Matrix SDK.
      - name: rustfmt check
        run: cargo fmt --check
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev \
            libdbus-1-dev
      - name: Submodule sync guard
        run: node scripts/check-sdk-submodule.mjs
      - name: Clippy (workspace, all targets)
        run: cargo clippy --profile ci --workspace --all-targets --locked -- -D warnings
      # The QA binaries set `required-features = ["qa-bin"]`, so the workspace
      # run above skips them.
      - name: Clippy (QA binaries)
        run: cargo clippy --profile ci -p koushi-qa --features qa-bin --all-targets --locked -- -D warnings
      # Release builds compile without debug assertions, which removes QA/debug
      # cfg paths; lint that configuration too (the #1035 warnings were
      # release-only).
      - name: Clippy (release configuration)
        run: cargo clippy --release --workspace --locked -- -D warnings
