# cargo-deny configuration for the matrix-desktop workspace.
# See: https://embarkstudios.github.io/cargo-deny/
#
# Phase 0 (#87): encode current-correct boundaries. Rules here pass on the
# current codebase and will catch future violations. Grandfathered exceptions
# are documented inline.

[advisories]
# Audit database for known security vulnerabilities.
# yanked = "deny"  # disabled: the vendored SDK pulls in several yanked crates
#
# Grandfathered advisories: these are known issues in transitive dependencies
# (primarily the vendored Matrix Rust SDK) with no available fix. Each is
# documented with why it is accepted.
ignore = [
    # RUSTSEC-2026-0370/0371/0372: zvariant, zbus_names and zvariant_derive
    # were merged into zbus 6 and are unmaintained as standalone crates.
    # These are informational maintenance notices with no patched versions:
    # https://github.com/z-galaxy/zbus/issues/2043
    # Existing notify-rust and Tauri notification/opener/single-instance
    # dependencies still require zbus 5, so a lockfile update cannot remove
    # them. Drop these exceptions when those upstream users migrate to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # RUSTSEC-2024-0370: proc-macro-error is unmaintained. Tauri's gtk3 stack
    # still pulls gtk3-macros, which pulls this compile-time macro helper. No
    # runtime code path depends on it directly.
    "RUSTSEC-2024-0370",
    # RUSTSEC-2026-0319: anymap2 is unmaintained. It enters through the
    # vendored Matrix SDK's event-handler context map
    # (crates/matrix-sdk/src/event_handler/mod.rs), which is upstream-owned,
    # and there is no available fix.
    "RUSTSEC-2026-0319",
    # RUSTSEC-2026-0370/0371/0372: zvariant, zbus_names, and zvariant_derive
    # are INFO Unmaintained after consolidation into zbus 6, not vulnerability
    # advisories. Tauri's opener/single-instance/notification plugins and our
    # notify-rust dependency still require zbus 5, with no compatible patched
    # standalone versions. Remove these when that dependency graph no longer
    # includes the standalone crates. Upstream: z-galaxy/zbus#2043.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # RUSTSEC-2026-0459: libsqlite3-sys 0.38.2 bundles SQLite 3.53.2, which is
    # below the 3.54.0 fix for CVE-2026-119375 (uninitialized page-cache memory
    # returned when a database is opened together with a sibling -wal whose page
    # size differs). There is no upgrade path inside the vendored SDK: rusqlite
    # 0.40.2 requires libsqlite3-sys ^0.38, the patched 0.39 ships with rusqlite
    # 0.41, and matrix-sdk-sqlite 0.19.1 pins rusqlite at 0.40.2. Reaching the
    # patched crate means moving the vendor/matrix-rust-sdk submodule, tracked in
    # #1841; this exception exists to keep main and every PR buildable until then.
    #
    # Exposure today: the bundled source is compiled only for Windows, where
    # there is no sqlite3.lib to link (crates/koushi-sdk/Cargo.toml), so the
    # affected copy ships in the Windows artifact; macOS and Linux link the
    # system library, and macOS 3.51.0 is also below 3.54.0, so not bundling is
    # not itself a mitigation. The advisory's vector is local: a process must
    # open a database whose sibling -wal a less trusted party could have
    # written, and Koushi opens only its own store directory.
    # Drop this exception when #1841 moves the vendored SDK to rusqlite 0.41.
    "RUSTSEC-2026-0459",
]

[licenses]
# Accept the OSI-approved / permissive licenses present in the workspace.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSD-1-Clause",
    "ISC",
    "0BSD",
    "MIT-0",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    # Creative Commons permissive (used by webpki-roots data sets).
    "CDLA-Permissive-2.0",
    # zlib with acknowledgement (fastdivide).
    "zlib-acknowledgement",
]

# LGPL 2.1+ is in the workspace via r-efi. r-efi is a UEFI binding used
# transitively through some system crates. It is a library with LGPL 2.1+
# static-link exception which is compatible with the product's MIT/Apache-2.0
# dual license when linked as a library (the exception permits static linking
# without triggering GPL copyleft). Allow it explicitly and review if the
# version changes.
[[licenses.exceptions]]
allow = ["LGPL-2.1-or-later"]
name = "r-efi"

# imbl / bitmaps / imbl-sized-chunks declare "MPL-2.0+" which is not a
# canonical SPDX identifier (no "+" operator exists in SPDX for MPL-2.0;
# they intend "MPL-2.0 or later"). Accept these with explicit allowances since
# MPL-2.0 is already in the allow list and the "+" is cosmetic.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "imbl"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "bitmaps"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
name = "imbl-sized-chunks"

[bans]
# Check for duplicate versions of the same crate (warn, not deny, to avoid
# blocking on upstream version resolution churn in the vendored SDK).
multiple-versions = "warn"

# cargo-deny bans are dependency-graph-wide and cannot selectively allow a
# crate in one workspace member while denying it in another. The platform-dep
# boundary for koushi-state (the pure domain layer) is therefore
# enforced by scripts/check-domain-crate-platform-deps.mjs, which inspects
# that crate's Cargo.toml directly. deny.toml provides license compliance,
# advisory gating, and source integrity; per-crate layer enforcement is
# the script's responsibility.
#
# Grandfathered platform deps (NOT banned here; tracked for Phase 5 removal):
#   keyring in koushi-core and koushi-key — Phase 5 target for
#   SecretStore dependency inversion (trait SecretStore, platform adapters).
deny = []

# Explicitly allow crates that are expected in the dependency graph.
# This section is intentionally minimal for Phase 0.
skip = []

[sources]
# Only allow crates from crates.io, local path deps, the rev-pinned SDK fork,
# and the two upstream git dependencies that fork pins (ruma, vodozemac). The
# SDK was moved from submodule path deps to a git dependency in issue #180 so
# Cargo fingerprints it by rev instead of path mtimes.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/shinaoka/matrix-rust-sdk-work.git",
    # The vendored SDK pins ruma and vodozemac to git revisions; Koushi depends
    # on the same revisions so shared types are the same crate instances.
    "https://github.com/ruma/ruma",
    "https://github.com/matrix-org/vodozemac/",
]
