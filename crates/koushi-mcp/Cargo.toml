[package]
name = "koushi-mcp"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "stdio MCP adapter for a running Koushi instance"

[lib]
name = "koushi_mcp"
path = "src/lib.rs"

[[bin]]
name = "koushi-mcp"
path = "src/main.rs"

[[bin]]
name = "koushi"
path = "src/bin/koushi.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
