[workspace]
members = [
    "crates/koushi-state",
    "crates/koushi-protocol",
    "crates/koushi-search",
    "crates/koushi-key",
    "crates/koushi-sdk",
    "crates/koushi-core",
    "crates/koushi-mcp-host",
    "crates/koushi-qa",
    "crates/koushi-diagnostics",
    "crates/koushi-media",
    "crates/koushi-store",
    "crates/koushi-notify",
    "crates/koushi-core-testkit",
    "crates/koushi-mcp",
    "apps/desktop/src-tauri",
    "tests/windows-overlay-acl",
    "spikes/sidebar-composition",
    "spikes/key-management",
]
default-members = [
    "crates/koushi-state",
    "crates/koushi-protocol",
    "crates/koushi-search",
    "crates/koushi-key",
    "crates/koushi-sdk",
    "crates/koushi-core",
    "crates/koushi-diagnostics",
    "crates/koushi-store",
    "crates/koushi-notify",
    "apps/desktop/src-tauri",
]
resolver = "2"
exclude = ["vendor/matrix-rust-sdk"]

[workspace.package]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
matrix-sdk = { path = "vendor/matrix-rust-sdk/crates/matrix-sdk", default-features = false, features = ["automatic-room-key-forwarding", "e2e-encryption", "experimental-search", "experimental-send-custom-to-device", "sqlite"] }
matrix-sdk-base = { path = "vendor/matrix-rust-sdk/crates/matrix-sdk-base" }
matrix-sdk-search = { path = "vendor/matrix-rust-sdk/crates/matrix-sdk-search" }
matrix-sdk-test = { path = "vendor/matrix-rust-sdk/testing/matrix-sdk-test" }
matrix-sdk-ui = { path = "vendor/matrix-rust-sdk/crates/matrix-sdk-ui", default-features = false }
image = { version = "0.25.9", default-features = false, features = ["bmp", "jpeg", "png", "webp"] }
heif-oxide = "0.1.0"

# Local development (build, `cargo test`, `tauri dev`) keeps line tables so a
# backtrace still names the file and line without retaining full DWARF for every
# workspace crate. Dependencies carry no debug info (below); export
# `CARGO_PROFILE_DEV_DEBUG=1` for a full-symbol LLDB/GDB session. `target/` is
# disposable after such a change: `kache clean -n`, then `kache clean -y`.
[profile.dev]
debug = 0                  # DWARF only enlarges target and build-cache output; see the note above

[profile.dev.package."*"]
debug = false

# Hosted correctness CI should retain assertions and overflow checks while
# avoiding debuginfo and incremental artifacts that are not useful across
# ephemeral runners. Local development and release profiles remain unchanged.
[profile.ci]
inherits = "test"
opt-level = 0
debug = 0
debug-assertions = true
overflow-checks = true
incremental = false
strip = "symbols"

# Cargo strips debuginfo from release proc-macros and build scripts. With rustc
# 1.96 that strip leaves LC_SYMTAB.stroff misaligned, and macOS 27 dyld refuses
# to load the dylib (rust-lang/rust#157750). These host artifacts are not
# shipped; release binaries keep the release profile's own strip setting.
[profile.release.build-override]
strip = "none"
